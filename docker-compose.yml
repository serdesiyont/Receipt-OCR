services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      # These variables are used by the PostgreSQL image to initialize the DB
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expose port on host for direct access (optional)
      - "5431:5432"
    volumes:
      # Persist data to prevent data loss on container stop/recreate
      - postgres_data:/var/lib/postgresql/data

  # # 2. NestJS Backend Service
  # backend:
  #   build:
  #     context: ./backend # Path to your NestJS Dockerfile
  #     dockerfile: Dockerfile
  #   container_name: nestjs_backend
  #   restart: always
  #   ports:
  #     # Expose the NestJS port on the host
  #     - "3000:3000"
  #   environment:
  #     # Key: Use the service name 'db' as the host for the database
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #     # Other environment variables like app port, etc.
  #   depends_on:
  #     - db # Ensure the database starts before the backend

  # # 3. Next.js Frontend Service
  # frontend:
  #   build:
  #     context: ./frontend # Path to your Next.js Dockerfile
  #     dockerfile: Dockerfile
  #   container_name: nextjs_frontend
  #   restart: always
  #   ports:
  #     # Expose the Next.js port on the host (Next.js is often on 3000,
  #     # but we use 3001 here to avoid conflict with NestJS's 3000)
  #     - "3001:3001"
  #   environment:
  #     # IMPORTANT: Frontend needs to know how to reach the backend
  #     # Use the backend service name: 'nestjs_backend'
  #     NEXT_PUBLIC_API_URL: http://backend:3000/api
  #   depends_on:
  #     - backend # Ensure the backend is running before the frontend

# Define named volume for data persistence
volumes:
  postgres_data:
